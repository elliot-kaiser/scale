<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kitchen Scale Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scale-card { background: #000; color: #00ffcc; font-family: monospace; border-radius: 12px; }
  </style>
</head>
<body class="p-3">

  <div class="container max-w-md">
    <div class="card scale-card text-center p-4 mb-3 shadow-sm">
      <small class="text-secondary text-uppercase">Live Scale Reading</small>
      <h1 class="display-2 fw-bold my-1" id="live-weight">0.0</h1>
      <span class="fs-4 text-secondary" id="active-unit">GRAMS</span>
      <div class="mt-3">
        <button class="btn btn-outline-info btn-sm px-4" onclick="tareScale()">TARE (ZERO)</button>
      </div>
    </div>

    <ul class="nav nav-pills nav-justified mb-3" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="scrape-tab" data-bs-toggle="pill" data-bs-target="#scrape" type="button">🌐 Recipe Link</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="search-tab" data-bs-toggle="pill" data-bs-target="#search" type="button">🔍 Ingredients</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="weight-tab" data-bs-toggle="pill" data-bs-target="#weight" type="button">⚖️ Body Weight</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="scrape">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Paste Online Recipe Link</h5>
          <div class="input-group mb-3">
            <input type="url" id="recipe-url" class="form-control" placeholder="https://www.allrecipes.com/recipe/...">
            <button class="btn btn-primary" onclick="scrapeRecipe()">Fetch</button>
          </div>
          
          <div id="recipe-results" style="display:none;">
            <h5 id="recipe-title" class="fw-bold text-primary"></h5>
            <ul id="recipe-ingredients" class="list-group mb-3"></ul>
            <button class="btn btn-success w-100 fw-bold py-2" onclick="startGuidedCook()">
              👨‍🍳 Start Guided Cook on OLED Scale
            </button>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="search">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Search Supabase Ingredients</h5>
          <input type="text" id="ing-search" class="form-control mb-2" placeholder="Search (e.g. Oats, Chicken)..." oninput="searchIngredients(this.value)">
          <div id="search-results" class="list-group mb-3"></div>
        </div>
      </div>

      <div class="tab-pane fade" id="weight">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Log Today's Body Weight</h5>
          <div class="input-group">
            <input type="number" step="0.1" id="body-weight-input" class="form-control" placeholder="Weight in lbs...">
            <button class="btn btn-success" onclick="logWeight()">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentRecipe = null;

    // Live Scale Polling
    async function updateWeight() {
      try {
        const res = await fetch('/api/weight');
        const data = await res.json();
        document.getElementById('live-weight').innerText = data.weight_g.toFixed(1);
        document.getElementById('active-unit').innerText = data.unit === 'oz' ? 'OUNCES' : 'GRAMS';
      } catch (e) {}
    }
    setInterval(updateWeight, 500);

    async function tareScale() {
      await fetch('/api/tare', { method: 'POST' });
    }

    // Recipe Scraper
    async function scrapeRecipe() {
      const url = document.getElementById('recipe-url').value;
      if (!url) return alert('Please enter a URL');
      
      const res = await fetch('/api/recipe/scrape', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      
      if (data.status === 'success') {
        currentRecipe = data;
        document.getElementById('recipe-title').innerText = data.title;
        const list = document.getElementById('recipe-ingredients');
        list.innerHTML = '';
        data.ingredients.forEach(i => {
          list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
            <span>${i.name}</span>
            <span class="badge bg-secondary rounded-pill">${i.target_g}g</span>
          </li>`;
        });
        document.getElementById('recipe-results').style.display = 'block';
      } else {
        alert('Failed to scrape recipe: ' + data.message);
      }
    }

    // 🚀 Start Guided Cook Handler
    async function startGuidedCook() {
      if (!currentRecipe) return;

      const res = await fetch('/api/recipe/start_guided', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          title: currentRecipe.title,
          ingredients: currentRecipe.ingredients
        })
      });

      const data = await res.json();
      if (data.status === 'success') {
        alert('Guided Cook Mode Activated! Look at your scale OLED display to begin adding ingredients.');
      }
    }

    // Ingredient Search
    async function searchIngredients(query) {
      if (query.length < 2) return;
      const res = await fetch(`/api/ingredients/search?q=${encodeURIComponent(query)}`);
      const items = await res.json();
      
      const container = document.getElementById('search-results');
      container.innerHTML = '';
      items.forEach(item => {
        container.innerHTML += `
          <button class="list-group-item list-group-item-action d-flex justify-content-between" onclick="logItem('${item.name}', ${item.calories_per_100g}, ${item.protein_per_100g}, ${item.carbs_per_100g}, ${item.fat_per_100g})">
            <span><strong>${item.name}</strong></span>
            <small>${item.calories_per_100g} kcal/100g</small>
          </button>`;
      });
    }

    async function logItem(name, cal, p, c, f) {
      const currentWeight = parseFloat(document.getElementById('live-weight').innerText) || 100;
      const factor = currentWeight / 100.0;
      
      await fetch('/api/log_meal', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          food_name: name,
          weight_g: currentWeight,
          calories: cal * factor,
          protein: p * factor,
          carbs: c * factor,
          fat: f * factor
        })
      });
      alert(`Logged ${currentWeight}g of ${name} to Supabase!`);
    }

    async function logWeight() {
      const w = document.getElementById('body-weight-input').value;
      if (!w) return;
      
      await fetch('/api/log_weight', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ weight_lbs: w })
      });
      alert('Body weight saved!');
    }
  </script>
</body>
</html>
